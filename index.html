<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <title>Mi simulador</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>Mi simulador de productos</h1>

  <div class="formulario">
    <input type="text" id="input-nombre" placeholder="Nombre del producto">
    <input type="number" id="input-precio" placeholder="Precio en MXN">
    <button id="btn-agregar">+ Agregar</button>
  </div>

  <input type="text" id="input-buscar" placeholder="🔍 Buscar producto...">

  <p id="mensaje"></p>

  <div id="banner-cotizacion"></div>

  <div id="contenedor-items"></div>

  <script src="js/main.js"></script>
</body>
</html>
